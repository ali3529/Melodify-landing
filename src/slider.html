<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comment Slider</title>
  <!-- Include Splide.js library and CSS file -->
  <link rel="stylesheet" href="https://unpkg.com/@splidejs/splide@3.0.9/dist/css/splide.min.css" />
  <script src="https://unpkg.com/@splidejs/splide@3.0.9/dist/js/splide.min.js"></script>
  <!-- Include Tailwind CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body>
  <div class="splide">
    <div class="splide__track">
      <ul class="splide__list">
        <li class="splide__slide">Comment 1</li>
        <li class="splide__slide">Comment 2</li>
        <li class="splide__slide">Comment 3</li>
      </ul>
    </div>
  </div>
  
  <!-- Add some CSS to style the active slide -->
  <style>
    .splide__slide--active {
      transform: scale(1.1);
      z-index: 1;
    }
  </style>
  
  <!-- Initialize the Splide.js slider with some options -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      new Splide('.splide', {
        type: 'loop',
        autoWidth: true,
        focus: 'center',
        speed: 1000,
        classes: {
          active: 'splide__slide--active',
        },
      }).mount();
    });
  </script>
</body>
</html>
